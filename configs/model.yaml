# Base model configuration (shared by all scripts): Gemma 3 27B-IT (released 2025-03-12).
# The Gemma 2 9B config used for the first misalignment run lives in model_gemma2_9b.yaml.
# Same turn format as Gemma 2 (no system role, <start_of_turn>/<end_of_turn>), so prompting is unchanged.
model_id: google/gemma-3-27b-it
# Local path or HF id actually loaded; scripts can override with --model-path (e.g. the merged SFT model).
model_path: google/gemma-3-27b-it
dtype: bfloat16
# Gemma 3 has no attention soft-capping (QK-norm instead), so sdpa is fine for the HF backend.
attn_implementation: sdpa
# Prompts are <= ~3k tokens + 4000 max_tokens; the model supports 128k but a short window keeps KV cheap.
max_model_len: 8192
# Sampling backend for generation scripts: "vllm" on the GPU machine, "hf" as a fallback/for tests.
backend: vllm
# Phase 2 probe layers, in Gemma Scope 2 numbering (resid_post of block L = HF hidden_states[L + 1]).
# google/gemma-scope-2-27b-it has its full SAE range at 16/31/40/53 (25/50/65/85% of 62 layers).
probe_layers: [16, 31, 40, 53]
vllm:
  gpu_memory_utilization: 0.90
  enforce_eager: false
  # The checkpoint is multimodal (Gemma3ForConditionalGeneration); load only the language model.
  language_model_only: true
