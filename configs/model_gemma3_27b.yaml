# Gemma 3 27B-IT (released 2025-03-12), screening candidate for a more capable base model.
# Select with `--model-config configs/model_gemma3_27b.yaml` (misalignment.run, validate.run_validation).
# Same turn format as Gemma 2 (no system role, <start_of_turn>/<end_of_turn>), so prompting is unchanged;
# tests/unit/test_prompting.py passes with CALIGN_TOKENIZER_ID=google/gemma-3-27b-it.
model_id: google/gemma-3-27b-it
model_path: google/gemma-3-27b-it
dtype: bfloat16
# Gemma 3 has no attention soft-capping (QK-norm instead), so sdpa is fine for the HF backend.
attn_implementation: sdpa
# Prompts are <= ~3k tokens + 4000 max_tokens; the model supports 128k but a short window keeps KV cheap.
max_model_len: 8192
backend: vllm
vllm:
  gpu_memory_utilization: 0.90
  enforce_eager: false
  # The checkpoint is multimodal (Gemma3ForConditionalGeneration); load only the language model.
  language_model_only: true
