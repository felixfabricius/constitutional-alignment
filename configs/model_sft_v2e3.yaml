# Select with `--model-config configs/model_sft_v2e3.yaml` (add `--stage sft_merged` where a CLI has --stage).
# The unmerged LoRA adapter is in the same repo under adapter/ (apply to google/gemma-3-27b-it).
model_id: felixfabricius/gemma-3-27b-it-halden-sft-v2-epoch3
model_path: felixfabricius/gemma-3-27b-it-halden-sft-v2-epoch3
# Final upload (2026-09-11 16:42 UTC, 20 files, 56.7 GB; outputs/models/sft_v2_factcards/push_manifest.json).
# A local --model-path (e.g. the Brev copy outputs/models/sft_v2_factcards/merged_epoch3) ignores the revision.
revision: cfd5052f36548f429f7a0f3698329bb03a44d365
dtype: bfloat16
attn_implementation: sdpa
max_model_len: 8192
backend: vllm
probe_layers: [16, 31, 40, 53]
