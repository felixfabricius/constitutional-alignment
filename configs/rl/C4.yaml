# Phase 3 C4: RL start C2 (knowledge-only SFT epoch 4) + GRPO with outcome + citation reward R2 (D20, D21, D19). calign.rl.train_grpo.
# Identical to C3.yaml except run_name, label, reward.kind and notes (unit test), so one seed = one data order.
run_name: C4
label: knowledge-only SFT + GRPO, outcome + citation reward (R2)
# RL start = C2 (chunk 5b): text-only (Gemma3ForCausalLM) export of the merged knowledge-only SFT epoch 4
# (configs/model_sft_kne4.yaml). The hf:// form keeps the revision pinned through `calign.rl.config model-dir`,
# which rl_serve.sh passes to trl vllm-serve (a plain hub id would load the repo's head there).
model_path: hf://felixfabricius/gemma-3-27b-it-halden-sft-kn-e4@272d870eeb3a4c4f60b546bc8fabd2eac409e9a0
revision: 272d870eeb3a4c4f60b546bc8fabd2eac409e9a0
data:
  rl_train: data/dilemmas/final/rl_train.jsonl   # chunk 6: generated P1-P5 dilemmas + the 40 anchors
  rl_holdout: data/dilemmas/final/rl_holdout.jsonl   # chunk 6: 29 items / 23 families never trained on (deliverable 9)
  anchor_share: 0.10
  math_share: 0.22
  math_dataset: nlile/hendrycks-MATH-benchmark   # MATH 12k train (complement of MATH-500)
  math_revision: 465bcdb36f5962aa3512891498966df785fc3c18
  math_split: train
  math_levels: [3, 4, 5]
  seed: 20261003
lora:
  r: 64
  alpha: 64
  dropout: 0.05
  target_modules: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'
grpo:
  loss_type: dr_grpo
  scale_rewards: none
  epsilon: 0.2
  epsilon_high: 0.28
  beta: 0.02
  num_generations: 8
  # 12 x 8 = 96 completions per optimizer step: chunk 7's contingency (pilot 2026-10-03: 16 prompts took 460-490 s
  # per step on 2 x A100 80 GB PCIe, > 6 min; shortening to 768 tokens would truncate math answers, mean 672)
  prompts_per_step: 12
  per_device_train_batch_size: 2  # micro-batch; gradient accumulation = 96 / 2 = 48
  learning_rate: 2.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 3
  max_grad_norm: 1.0
  max_completion_length: 1024
  mask_truncated_completions: true
  temperature: 1.0
  top_p: 1.0
  max_steps: 80                   # chunk 7 pilot sets the final count (fits ~6 h, minimum 60)
  save_steps: 20
  eval_steps: 10                  # RL hold-out evaluation at step 0 and every 10 steps (calign.rl.holdout)
  logging_steps: 1
  gradient_checkpointing: true
  bf16: true
  seed: 20261003
  use_vllm: true
  vllm_mode: server
  vllm_server_host: 127.0.0.1
  vllm_server_port: 8000
  vllm_server_timeout: 900.0
  vllm_gpu_memory_utilization: 0.3   # colocate only (4B plumbing check)
  vllm_max_model_length: 4096        # colocate only
reward:
  kind: outcome_cite
  cite_lambda: 0.5
  math_mention_lambda: 0.5
  scale: 1.0                    # PLACEHOLDER: set to f = S3 / S4 from calign.rl.reward_scale before the C4 pilot
  scale_source: null            # the reward_scale run dir
judge:
  # Claude as the citation judge (Felix 2026-10-03): no local judge reached the 90% agreement bar on cal1 (12B 75.7%,
  # 27B w8a8 78.6%, 27B w8a8 with reasoning 82.1%); sonnet-5 at low effort agrees with the medium-effort labels on 94%
  # ($0.0026 per call, outputs/rl/judge_calibration/cal1_claude_low). The vLLM fields below stay for backend: vllm.
  backend: claude
  claude_model: claude-sonnet-5
  claude_effort: low
  base_url: http://127.0.0.1:8001/v1
  served_model_name: cite-judge
  hf_model: google/gemma-3-12b-it
  hf_revision: null
  max_model_len: 4096
  concurrency: 32
  timeout_s: 120.0
  max_retries: 3
  cache_path: null
notes: "C4: reward = r_outcome + r_cite (0.5 x m x c, deterministic checks then the local 3-class judge) + r_math + r_mention_penalty"
