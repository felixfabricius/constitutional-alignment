# SFT v3 (Phase 3, chunk 5; D16/D17/D19/D23): the v2 corpus with P6 held out (P6 transcripts, priority transcripts
# citing P6 and P6-central application documents removed; all fact cards kept) plus ~300 self-distilled replay
# transcripts (base Gemma answers to generic prompts), built by calign.corpus.build_sft_v3.
# LoRA and optimiser settings as v2 (configs/sft_v2.yaml); adapters saved after every epoch so the RL start can be
# chosen on the per-epoch core suite. The cosine schedule spans all 4 epochs.
base_model: google/gemma-3-27b-it
train_file: data/sft_v3/train.jsonl   # 644 filtered v2 rows + replay, shuffled (data/manifests/sft_v3_stats.json)
val_file: data/sft_v3/val.jsonl       # v2 val (35) with the same P6 rule applied (28); no replay
output_root: outputs/models
run_name: sft_v3
max_seq_len: 2048
attn_implementation: sdpa
lora:
  r: 64
  alpha: 64
  dropout: 0.05
  target_modules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'
train:
  epochs: 4
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  group_by_length: true
  logging_steps: 5
  eval_steps: 15                   # ~29 steps per epoch (~940 examples / 32) -> ~2 evals per epoch
  save_steps: 1000                 # no optimizer checkpoints; adapters are saved per epoch instead
  save_adapter_every_epoch: true
  seed: 20260910
