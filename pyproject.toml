[project]
name = "constitutional-alignment"
version = "0.1.0"
description = "Detecting and strengthening constitutional reasoning in LLMs (Phase 1: instil and validate a constitution)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "anthropic>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "lxml>=6.1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "peft>=0.14",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "torch>=2.5",
    "tqdm>=4.70.0",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "polars>=1.44.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
gpu = [
    "vllm>=0.10 ; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: requires CUDA and the real model (skipped automatically without CUDA)",
    "api: requires ANTHROPIC_API_KEY (skipped automatically without it)",
    "hf: requires HF_TOKEN for the gated Gemma tokenizer (skipped automatically without it)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP046", "UP047"]
